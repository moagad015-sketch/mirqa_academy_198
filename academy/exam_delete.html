<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>حذف الاختبار - أكاديمية مِرقاة</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f7f4ed;
    padding:50px;
}

.box{
    max-width:600px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    color:#b3261e;
}

button{
    background:#b3261e;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}

a{
    display:inline-block;
    margin-right:15px;
    color:#24483b;
}

</style>

</head>

<body>

<div class="box">

<h1>🗑️ حذف الاختبار</h1>

<p>
هل أنت متأكد أنك تريد حذف الاختبار:
</p>

<h2>{{ exam.title }}</h2>

<p>
⚠️ سيتم حذف الاختبار والأسئلة والإجابات المرتبطة به.
</p>

<form method="post">

{% csrf_token %}

<button type="submit">
نعم، حذف الاختبار
</button>

<a href="{% url 'exam_list' %}">
إلغاء
</a>

</form>

</div>

</body>

</html>
