<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | أكاديمية مِرقاة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ea;
            color: #183c32;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #b08b45;
            margin: 8px 0 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2f6655;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2f6655;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        a {
            color: #2f6655;
            text-decoration: none;
            font-weight: bold;
        }

        .errorlist {
            color: #a33;
            padding-right: 20px;
            font-size: 14px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .register-links {
            margin-top: 10px;
        }

        .register-links a {
            margin: 0 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            🌿 أكاديمية مِرقاة
        </div>

        <div class="subtitle">
            نرتقي بالعلم، درجةً بعد درجة.
        </div>

        <h2 style="text-align:center;">
            تسجيل الدخول
        </h2>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">
                اسم المستخدم
            </label>

            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.password.id_for_label }}">
                كلمة المرور
            </label>

            {{ form.password }}
            {{ form.password.errors }}

            <button type="submit">
                تسجيل الدخول
            </button>

        </form>


        <div class="register">

            ليس لديك حساب؟

            <div class="register-links">

                <a href="{% url 'student_register' %}">
                    👨‍🎓 تسجيل طالب
                </a>

                |

                <a href="{% url 'teacher_register' %}">
                    👨‍🏫 تسجيل معلم
                </a>

            </div>

        </div>


        <div class="back">

            <a href="{% url 'home' %}">
                ← العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </div>

</div>

</body>

</html>
