<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حذف الدورة | أكاديمية مِرقاة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4ed;
            color: #183c2b;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .delete {
            background: #a33;
            color: white;
        }

        .cancel {
            background: #183c2b;
            color: white;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="icon">⚠️</div>

            <h1>حذف الدورة</h1>

            <p>
                هل أنت متأكد أنك تريد حذف دورة:
                <strong>{{ course.title }}</strong>؟
            </p>

            <p>
                سيتم حذف الدورة نهائيًا.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="actions">

                    <button type="submit" class="button delete">
                        🗑️ نعم، حذف الدورة
                    </button>

                    <a href="/dashboard/courses/" class="button cancel">
                        إلغاء
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
